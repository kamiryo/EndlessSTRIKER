<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>STRIKER - Retro 8-Bit Soccer Runner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top utility bar (subtle, out of the way) -->
    <header class="top-bar">
      <div class="cartridge-badge">
        <span class="cart-dot"></span>
        <span class="cart-title">8-BIT SOCCER CARTRIDGE</span>
      </div>
      <div class="controls-bar">
        <button id="btn-crt" class="ui-btn active" type="button" title="CRTスキャンライン切替">CRT: ON</button>
        <button id="btn-sound" class="ui-btn active" type="button" title="サウンド切替">SOUND: ON</button>
      </div>
    </header>

    <!-- Main Retro Screen Container -->
    <main class="screen-wrapper" id="screen-wrapper">
      <div class="crt-frame" id="crt-frame">
        <canvas id="game-canvas" width="320" height="180"></canvas>
        <div class="scanlines" id="scanlines"></div>
        <div class="crt-vignette"></div>
      </div>
    </main>

    <!-- Footer instructions for PC / Mobile -->
    <footer class="bottom-hint">
      <span class="hint-pill"><strong>長押し (HOLD)</strong> : 上へ移動</span>
      <span class="hint-pill"><strong>離す (RELEASE)</strong> : 下へ移動</span>
      <span class="hint-pill"><strong>PC</strong> : SPACE / クリック長押し / ↑↓キー</span>
    </footer>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
